# Ночной бэкап прод-базы.
#
# Бесплатный тариф Supabase резервных копий не делает вовсе, поэтому без этого
# потеря данных была бы необратимой.
#
# Дамп снимается ролью backup_ro — она имеет только SELECT, так что утечка
# секрета не даст возможности изменить или удалить данные.
#
# Запускается по расписанию и вручную. На pull_request намеренно не вешается:
# репозиторий публичный, и секрет не должен попадать в прогоны от форков.

name: Backup database

on:
  schedule:
    # 02:30 UTC — 07:30 по Ташкенту, ночное окно с минимальной нагрузкой.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Клиент PostgreSQL под версию сервера
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "::error::секрет BACKUP_DATABASE_URL не задан"; exit 1; }

          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq

          # Мажор сервера спрашиваем у самого сервера, а не зашиваем числом:
          # Supabase обновляет версию сам, и зашитая «17» однажды снова
          # разойдётся. Для запроса годится и старый psql — несовпадение
          # версий запрещает только pg_dump.
          MAJOR=$(psql "$DB_URL" -tAc 'SHOW server_version' | cut -d. -f1 | tr -d '[:space:]')
          echo "сервер: PostgreSQL $MAJOR"
          sudo apt-get install -y -qq "postgresql-client-$MAJOR"

          # Явный PATH обязателен. В образе раннера /usr/bin/pg_dump — это
          # клиент 16, и он перекрывает только что установленный: первый
          # ночной бэкап упал на «server version mismatch» именно так, хотя
          # нужный клиент уже стоял рядом.
          echo "/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_PATH"
          echo "PG_MAJOR=$MAJOR" >> "$GITHUB_ENV"

      - name: Снятие дампа
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "::error::секрет BACKUP_DATABASE_URL не задан"; exit 1; }

          # Версию клиента проверяем до дампа: иначе о несовпадении узнаём из
          # ошибки pg_dump, а бэкапа за сутки уже нет.
          CLIENT=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump: $CLIENT, сервер: $PG_MAJOR"
          test "$CLIENT" -ge "$PG_MAJOR" || {
            echo "::error::pg_dump $CLIENT старше сервера $PG_MAJOR — дамп будет отказан"; exit 1; }

          STAMP=$(date -u +%Y-%m-%d)
          # --no-owner и --no-acl: восстанавливать будем в другую базу, где роли
          # Supabase отсутствуют, и их упоминание ломало бы импорт.
          pg_dump "$DB_URL" \
            --schema=public --no-owner --no-acl --format=custom --compress=9 \
            --file="vetglobal-$STAMP.dump"
          ls -lh "vetglobal-$STAMP.dump"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Проверка, что дамп пригоден к восстановлению
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "vetglobal-$STAMP.dump")
          # Пустой дамп весит считанные байты. Молча сохранить такой файл
          # хуже, чем упасть: о потере узнали бы только при восстановлении.
          test "$SIZE" -gt 4096 || { echo "::error::дамп подозрительно мал ($SIZE байт)"; exit 1; }

          # Содержимое читаем в файл, а не в конвейер с head: head закрывает
          # конвейер после пятой строки, pg_restore получает «broken pipe» и
          # шаг падает под pipefail — на этом первый успешный дамп и был
          # забракован, хотя сам архив был целым.
          pg_restore --list "vetglobal-$STAMP.dump" > toc.txt
          ENTRIES=$(grep -c '^[0-9]' toc.txt || true)
          echo "записей в архиве: $ENTRIES, размер: $SIZE байт"
          head -5 toc.txt

          # Размер проверяет, что файл не пуст, а число записей — что внутри
          # действительно схема, а не один заголовок: схема VetGlobal это
          # десятки таблиц, то есть сотни записей.
          test "$ENTRIES" -ge 20 || { echo "::error::в архиве всего $ENTRIES записей — схема не попала в дамп"; exit 1; }
          rm -f toc.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vetglobal-db-${{ env.STAMP }}
          path: vetglobal-*.dump
          retention-days: 30
          if-no-files-found: error
