# Ночной бэкап прод-базы.
#
# Бесплатный тариф Supabase резервных копий не делает вовсе, поэтому без этого
# потеря данных была бы необратимой.
#
# Дамп снимается ролью backup_ro — она имеет только SELECT, так что утечка
# секрета не даст возможности изменить или удалить данные.
#
# Запускается по расписанию и вручную. На pull_request намеренно не вешается:
# репозиторий публичный, и секрет не должен попадать в прогоны от форков.

name: Backup database

on:
  schedule:
    # 02:30 UTC — 07:30 по Ташкенту, ночное окно с минимальной нагрузкой.
    # Не в начало часа: по документации GitHub запуски по расписанию в это время
    # задерживаются и пропускаются чаще всего (19.11.2026 ночной не пришёл вовсе).
    # 21:41 UTC — 02:41 по Ташкенту. Страховка — сторож в Uptime.
    - cron: '41 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # Из репозитория нужен только сертификат для шифрования дампа.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/backup-cert.pem
          sparse-checkout-cone-mode: false

      - name: Клиент PostgreSQL под версию сервера
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "::error::секрет BACKUP_DATABASE_URL не задан"; exit 1; }

          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq

          # Мажор сервера спрашиваем у самого сервера, а не зашиваем числом:
          # Supabase обновляет версию сам, и зашитая «17» однажды снова
          # разойдётся. Для запроса годится и старый psql — несовпадение
          # версий запрещает только pg_dump.
          MAJOR=$(psql "$DB_URL" -tAc 'SHOW server_version' | cut -d. -f1 | tr -d '[:space:]')
          echo "сервер: PostgreSQL $MAJOR"
          sudo apt-get install -y -qq "postgresql-client-$MAJOR"

          # Явный PATH обязателен. В образе раннера /usr/bin/pg_dump — это
          # клиент 16, и он перекрывает только что установленный: первый
          # ночной бэкап упал на «server version mismatch» именно так, хотя
          # нужный клиент уже стоял рядом.
          echo "/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_PATH"
          echo "PG_MAJOR=$MAJOR" >> "$GITHUB_ENV"

      - name: Снятие дампа
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "::error::секрет BACKUP_DATABASE_URL не задан"; exit 1; }

          # Версию клиента проверяем до дампа: иначе о несовпадении узнаём из
          # ошибки pg_dump, а бэкапа за сутки уже нет.
          CLIENT=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump: $CLIENT, сервер: $PG_MAJOR"
          test "$CLIENT" -ge "$PG_MAJOR" || {
            echo "::error::pg_dump $CLIENT старше сервера $PG_MAJOR — дамп будет отказан"; exit 1; }

          STAMP=$(date -u +%Y-%m-%d)
          # --no-owner и --no-acl: восстанавливать будем в другую базу, где роли
          # Supabase отсутствуют, и их упоминание ломало бы импорт.
          pg_dump "$DB_URL" \
            --schema=public --no-owner --no-acl --format=custom --compress=9 \
            --file="vetglobal-$STAMP.dump"
          ls -lh "vetglobal-$STAMP.dump"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Проверка, что дамп пригоден к восстановлению
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "vetglobal-$STAMP.dump")
          # Пустой дамп весит считанные байты. Молча сохранить такой файл
          # хуже, чем упасть: о потере узнали бы только при восстановлении.
          test "$SIZE" -gt 4096 || { echo "::error::дамп подозрительно мал ($SIZE байт)"; exit 1; }

          # Содержимое читаем в файл, а не в конвейер с head: head закрывает
          # конвейер после пятой строки, pg_restore получает «broken pipe» и
          # шаг падает под pipefail — на этом первый успешный дамп и был
          # забракован, хотя сам архив был целым.
          pg_restore --list "vetglobal-$STAMP.dump" > toc.txt
          ENTRIES=$(grep -c '^[0-9]' toc.txt || true)
          echo "записей в архиве: $ENTRIES, размер: $SIZE байт"
          head -5 toc.txt

          # Размер проверяет, что файл не пуст, а число записей — что внутри
          # действительно схема, а не один заголовок: схема VetHub это
          # десятки таблиц, то есть сотни записей.
          test "$ENTRIES" -ge 20 || { echo "::error::в архиве всего $ENTRIES записей — схема не попала в дамп"; exit 1; }
          rm -f toc.txt

      # Оглавление не доказывает, что дамп восстановится. Восстанавливаем его
      # в чистый Postgres той же версии без права на ошибку и сверяем строки с
      # продом. Схему public удаляем заранее: дамп создаёт её сам, и в свежей
      # базе это была бы единственная ошибка восстановления.
      - name: Пробное восстановление
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run -d --name drill -e POSTGRES_PASSWORD=drill -p 55432:5432 "postgres:$PG_MAJOR" >/dev/null
          for i in $(seq 1 30); do docker exec drill pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          R=postgresql://postgres:drill@localhost:55432/postgres
          psql "$R" -qc 'DROP SCHEMA public CASCADE'
          pg_restore --no-owner --no-acl --exit-on-error -d "$R" "vetglobal-$STAMP.dump"
          # Точного равенства не требуем: между дампом и подсчётом на проде
          # могли появиться новые строки. Ловим пустое или битое восстановление.
          for t in User Category Product Offer Order StoredFile _prisma_migrations; do
            src=$(psql "$DB_URL" -tAc "select count(*) from \"$t\"")
            dst=$(psql "$R" -tAc "select count(*) from \"$t\"")
            echo "$t: прод $src, восстановлено $dst"
            if [ "$dst" -gt "$src" ] || { [ "$src" -gt 0 ] && [ "$dst" -eq 0 ]; }; then
              echo "::error::$t: восстановлено $dst строк при $src на проде"; exit 1
            fi
          done
          docker rm -f drill >/dev/null

      # Репозиторий публичный, а артефакт может скачать любой вошедший в GitHub.
      # До этого шага дампы — с пользователями, телефонами, заказами и закрытыми
      # лицензиями — лежали открыто. Наружу уходит только зашифрованный файл;
      # в репозитории лишь сертификат, закрытый ключ хранит владелец.
      # Восстановление:
      #   openssl cms -decrypt -binary -inform DER -inkey backup-decrypt-key.pem \
      #     -in vetglobal-ДАТА.dump.cms -out vetglobal-ДАТА.dump
      #   pg_restore --no-owner --no-acl -d "$DATABASE_URL" vetglobal-ДАТА.dump
      - name: Шифрование
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "vetglobal-$STAMP.dump" -out "vetglobal-$STAMP.dump.cms" .github/backup-cert.pem
          rm "vetglobal-$STAMP.dump"
          ls -lh "vetglobal-$STAMP.dump.cms"

      - uses: actions/upload-artifact@v4
        with:
          name: vetglobal-db-${{ env.STAMP }}
          path: vetglobal-*.dump.cms
          retention-days: 30
          if-no-files-found: error

      # Бесплатный Supabase — 500 МБ на базу; сверх лимита база переходит в
      # режим только чтения, и заказы перестают оформляться. Файлы (фото,
      # документы) хранятся в самой базе, поэтому рост идёт в основном от них.
      # Шаг последний: бэкап к этому моменту уже сохранён.
      - name: Запас бесплатного тарифа базы
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          BYTES=$(psql "$DB_URL" -tAc 'select pg_database_size(current_database())' | tr -d '[:space:]')
          MB=$((BYTES / 1048576))
          echo "база: $MB МБ из 500 бесплатных"
          if [ "$MB" -ge 450 ]; then
            echo "::error::база $MB МБ — у предела бесплатного тарифа (500 МБ)"; exit 1
          fi
          if [ "$MB" -ge 350 ]; then
            echo "::warning::база $MB МБ из 500 — пора выносить файлы в бесплатное хранилище Supabase Storage (S3_ENDPOINT)"
          fi

      - name: Сбой — в Telegram команды
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          WHAT: ночной бэкап не прошёл (дамп, пробное восстановление или место в базе)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Telegram команды (секреты от «Notifications setup»); без них — молча.
          tg() { [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || return 0
            jq -n --arg c "$TG_CHAT" --arg t "$1" '{chat_id: $c, text: $t, disable_web_page_preview: true}' \
              | curl -s -m 20 -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                  -H 'Content-Type: application/json' --data @- || true; }
          tg "$(printf '🔴 VetHub: %s\n%s' "$WHAT" "$RUN_URL")"

  # Схема базы прода совпадает со схемой кода.
  #
  # Так было не всегда: прод поднялся из бэкапа старой схемы, запуск принял её
  # как исходную миграцию 0_init, и в базе не оказалось таблицы тарифов
  # доставки и части колонок заказа. Падали удаление аккаунта и тарифы, а
  # заметили это только по ошибке 500. Проверка идёт той же ролью только на
  # чтение: для сравнения схем хватает чтения каталога.
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Схема базы совпадает с кодом
        working-directory: backend
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -uo pipefail
          test -n "$DB_URL" || { echo "::error::секрет BACKUP_DATABASE_URL не задан"; exit 1; }
          # Версия Prisma — как в backend/package.json.
          npx --yes prisma@5.22.0 migrate diff \
            --from-url "$DB_URL" --to-schema-datamodel prisma/schema.prisma \
            --script --exit-code > drift.sql
          code=$?
          if [ "$code" = 0 ]; then echo "расхождений нет"; exit 0; fi
          if [ "$code" = 2 ]; then
            echo "::error::схема базы прода расходится с кодом — SQL, который её выровнял бы:"
            cat drift.sql
            exit 1
          fi
          echo "::error::сравнение схем не удалось (код $code)"; exit 1

      - name: Сбой — в Telegram команды
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          WHAT: схема базы прода расходится с кодом
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Telegram команды (секреты от «Notifications setup»); без них — молча.
          tg() { [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || return 0
            jq -n --arg c "$TG_CHAT" --arg t "$1" '{chat_id: $c, text: $t, disable_web_page_preview: true}' \
              | curl -s -m 20 -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                  -H 'Content-Type: application/json' --data @- || true; }
          tg "$(printf '🔴 VetHub: %s\n%s' "$WHAT" "$RUN_URL")"
