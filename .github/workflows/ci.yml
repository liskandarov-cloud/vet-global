# Проверки кода на каждом пуше и пул-реквесте.
#
# До этого в репозитории не было CI вовсе: 26 e2e-тестов существовали, но не
# запускались. Из-за этого набор интеграционных тестов месяц был сломан
# синтаксической ошибкой, и никто об этом не знал.
#
# База поднимается сервисным контейнером, а не берётся боевая: тесты создают и
# удаляют записи, и трогать ими прод нельзя.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'ops/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — типы и e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        # Без health-check шаги начинаются раньше, чем база примет соединение.
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      JWT_SECRET: ci-secret-at-least-32-characters-long!!
      JWT_EXPIRES_IN: 7d
      PLATFORM_COMMISSION_PERCENT: '12'
      VETPOINTS_EARN_PERCENT: '1'
      VETPOINTS_MAX_SPEND_PERCENT: '10'
      PAYMENTS_MODE: mock
      DIDOX_MODE: mock
      # Тестовые ключи платёжных протоколов. Боевых здесь нет и быть не может:
      # это значения, против которых проверяется логика подписи и авторизации.
      #
      # Без них набор молча пропускал проверки Payme и Click — а это самый
      # денежный код в проекте. Когда их наконец задали, оба теста упали: они
      # брали произвольный товар каталога, и к этому моменту прогона он
      # оказывался «под заказ», оплата которого запрещена.
      PAYME_KEY: ci-payme-test-key
      PAYME_MERCHANT_ID: ci-payme-merchant
      CLICK_SERVICE_ID: '12345'
      CLICK_MERCHANT_ID: '54321'
      CLICK_SECRET_KEY: ci-click-test-secret
      ADMIN_EMAIL: admin@vetglobal.com
      ADMIN_PASSWORD: ci-admin-password
      # Демо-данные нужны: часть e2e опирается на товары и продавцов из сида.
      SEED_DEMO: 'true'
      # Набор делает больше 120 запросов в минуту и упирался в общий лимит
      # частоты, после чего падали тесты авторизации — хотя проверяли они не
      # частоту. Флаг предусмотрен в коде именно для прогонов; в render.yaml его
      # нет, на проде ограничитель работает.
      THROTTLE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Схема и демо-данные
        working-directory: backend
        # Миграциями, а не подгонкой базы под схему: CI обязан применять их тем
        # же способом, что и прод, иначе «работает в CI» ничего не говорит о
        # выкатке. База здесь пустая, поэтому миграции создают схему с нуля.
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Линт
        working-directory: backend
        # Линтера у бэкенда не было: скрипт lint в package.json был, а самого
        # eslint в зависимостях нет — команда падала на отсутствии конфига.
        run: npm run lint

      - name: Проверка типов
        working-directory: backend
        # Сборка падает на ошибках типов — это дешёвая проверка до тестов.
        run: npm run build

      - name: Проверка типов тестов
        working-directory: backend
        # Основной tsconfig исключает test/, поэтому сами тесты типами не
        # проверялись. Из-за этого набор интеграционных тестов месяц не
        # запускался: в конце файла стояла синтаксическая ошибка, а jest узнаёт
        # о такой только при запуске файла. Эта проверка ловит её до запуска.
        run: npx tsc -p tsconfig.spec.json

      - name: Юнит-тесты
        working-directory: backend
        # Арифметика денег: комиссия, объёмные скидки, списание баллов.
        # Идут раньше e2e — они быстрее и не требуют ни базы, ни сервера,
        # поэтому ошибку в формуле видно сразу, а не через минуту.
        run: npm run test

      - name: E2E против запущенного приложения
        working-directory: backend
        env:
          API_URL: http://localhost:8000/api
        # Сервер поднимается здесь же, а не отдельным шагом: фоновый процесс
        # между шагами может не дожить, а тесты обращаются к API по HTTP и без
        # него падают невнятным «fetch failed».
        run: |
          set -uo pipefail
          PORT=8000 node dist/main.js > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8000/api/health; then
              echo "API поднялся за ${i} с"
              break
            fi
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "::error::процесс API завершился до готовности"
              tail -60 /tmp/api.log; exit 1
            fi
            sleep 1
          done

          curl -sf -o /dev/null http://localhost:8000/api/health || {
            echo "::error::API не ответил за 60 с"; tail -60 /tmp/api.log; exit 1; }

          npm run test:e2e || { echo '--- логи API ---'; tail -80 /tmp/api.log; exit 1; }

  frontend:
    name: Фронтенд — сборка
    runs-on: ubuntu-latest
    env:
      # Публичный адрес, а не внутрисетевой: последний снаружи мёртв, и
      # серверные запросы по нему молча отдавали бы пустые страницы.
      NEXT_PUBLIC_API_URL: https://vetglobal-backend.onrender.com/api
      SITE_URL: https://vetglobal-web.l-iskandarov.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

      - name: Тесты
        working-directory: frontend
        # Логика корзины: идентичность позиций при мульти-поставщике, кламп к
        # минимальному заказу, суммы. Раньше фронтенд проверялся только тем, что
        # собирается — поведение не проверялось вовсе.
        run: npm run test

      - run: npm run build
        working-directory: frontend
