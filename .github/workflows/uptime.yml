# Проверка доступности прода с оповещением через issue.
#
# Своего мониторинга не было: падение между выкатками замечали по жалобам.
# Платные сервисы не используем, поэтому оповещение идёт через GitHub — при
# создании issue владелец получает письмо, а история проблем остаётся в
# репозитории.
#
# Keepalive-worker пингует бэкенд каждые 10 минут, но он молчаливый: его задача
# не дать уснуть, а не сообщить. Здесь наоборот — проверить и разбудить людей.

name: Uptime

on:
  schedule:
    # Каждые 30 минут. Чаще нет смысла: расписание GitHub всё равно
    # выполняется с задержкой, а для оповещения это приемлемо.
    # Не в начало часа: там GitHub задерживает и пропускает запуски чаще всего.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Нужно, чтобы создавать и комментировать issue с отчётом о падении.
  issues: write
  # Сторож бэкапа запускает workflow «Backup database», если тот пропущен.
  actions: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # История main нужна сверке версий; без содержимого файлов — быстро.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none

      - name: Проверка контуров
        id: check
        run: |
          set -uo pipefail
          # Отчёт накапливаем в файле, а не в переменной: многострочное
          # значение в shell внутри YAML-блока легко ломает отступы.
          : > /tmp/failed.md

          check() {
            name="$1"; url="$2"; expect="$3"
            # Бэкенд на free-плане Render поднимается из сна до минуты,
            # поэтому таймаут щедрый и есть вторая попытка.
            for i in 1 2; do
              code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' "$url") || code=000
              # Render отвечает 503 и при приостановке сервиса — тогда
              # «разбудить» не поможет, нужен человек в дашборде. Отмечаем
              # явно, чтобы по issue было понятно, что делать.
              if [ "$code" = "503" ] && curl -sI -m 30 "$url" | grep -qi '^x-render-routing: suspend'; then
                code="503-suspended"
              fi
              if [ "$code" = "$expect" ]; then
                echo "ok   $name ($code)"
                return 0
              fi
              sleep 15
            done
            echo "FAIL $name — ожидался $expect, получен $code"
            printf -- '- **%s** — ожидался `%s`, получен `%s` (%s)\n' \
              "$name" "$expect" "$code" "$url" >> /tmp/failed.md
            return 1
          }

          check "API health"  "https://api.vethub.uz/api/health" 200 || true
          check "API каталог" "https://api.vethub.uz/api/categories" 200 || true
          check "Фронтенд"    "https://vethub.uz/" 200 || true
          check "Каталог"     "https://vethub.uz/catalog" 200 || true

          if [ -s /tmp/failed.md ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # Сторож бэкапа. Расписание GitHub пропускало ночной запуск, и сутки шли без
      # копии базы. Встроенный токен вправе запустить workflow вручную — если
      # последний удачный бэкап старше 26 часов, запускаем его отсюда.
      - name: Бэкап не старше суток
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          last=$(gh run list --workflow backup.yml --status success --limit 1 --json createdAt -q '.[0].createdAt' || true)
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$age" -gt $((26 * 3600)) ]; then
            echo "последний удачный бэкап: ${last:-нет}, $((age / 3600)) ч назад — запускаю"
            gh workflow run backup.yml --ref main
          else
            echo "последний удачный бэкап: $last ($((age / 3600)) ч назад)"
          fi

      # Доступен — ещё не значит свежий: упавшая выкатка оставляет прежний код,
      # и он продолжает отвечать 200.
      - name: Прод совпадает с main
        id: drift
        run: |
          if bash .github/scripts/deploy-drift.sh /tmp/failed.md; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # Репозиторий указан явно: без него `gh issue` вне git-каталога не знает,
      # с каким репозиторием работать. Без этого шаг падал
      # с первого же сбоя, и о простое прода с 12 октября 2026 не пришло ни
      # одного письма — проверка краснела, а тревога не поднималась.
      - name: Оповестить через issue
        if: steps.check.outputs.failed == 'true' || steps.drift.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail
          # Telegram команды (секреты от «Notifications setup»); без них — молча.
          tg() { [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || return 0
            jq -n --arg c "$TG_CHAT" --arg t "$1" '{chat_id: $c, text: $t, disable_web_page_preview: true}' \
              | curl -s -m 20 -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                  -H 'Content-Type: application/json' --data @- || true; }
          # Один открытый issue на инцидент: при каждой неудачной проверке
          # добавляем комментарий, а не заводим новый — иначе при длительном
          # падении репозиторий завалило бы десятками одинаковых тикетов.
          EXISTING=$(gh issue list --label outage --state open --limit 1 --json number -q '.[0].number' || true)
          {
            echo "Проверка прода не прошла:"
            echo
            cat /tmp/failed.md
            echo
            echo "Прогон: $RUN_URL"
          } > /tmp/body.md
          BODY=$(cat /tmp/body.md)

          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "добавлен комментарий к #$EXISTING"
          else
            # Ошибку не глушим целиком: «уже существует» — норма, остальное должно
            # быть видно в логе, иначе сломанное оповещение снова промолчит.
            gh label create outage --color B60205 --description "Недоступность прода" || echo "метка outage уже есть"
            gh issue create --title "Прод недоступен или отстаёт от main" --label outage --body "$BODY"
            # В Telegram — только начало инцидента, а не каждые полчаса.
            tg "$(printf '🔴 VetHub: прод недоступен или отстаёт от main\n\n%s' "$BODY")"
          fi

      - name: Закрыть issue, если всё поднялось
        if: steps.check.outputs.failed == 'false' && steps.drift.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail
          # Telegram команды (секреты от «Notifications setup»); без них — молча.
          tg() { [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || return 0
            jq -n --arg c "$TG_CHAT" --arg t "$1" '{chat_id: $c, text: $t, disable_web_page_preview: true}' \
              | curl -s -m 20 -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                  -H 'Content-Type: application/json' --data @- || true; }
          EXISTING=$(gh issue list --label outage --state open --limit 1 --json number -q '.[0].number' || true)
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body "Все проверки снова проходят — закрываю."
            gh issue close "$EXISTING"
            echo "закрыт #$EXISTING"
            tg "✅ VetHub: прод снова в порядке, инцидент #$EXISTING закрыт"
          fi

      - name: Уронить прогон при недоступности
        if: steps.check.outputs.failed == 'true' || steps.drift.outputs.failed == 'true'
        # Красный прогон в списке Actions — второй видимый признак помимо issue.
        run: exit 1
