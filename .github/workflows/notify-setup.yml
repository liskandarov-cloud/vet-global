# Подключение уведомлений на проде без дашборда Render.
#
# Секреты GitHub (значения нигде не печатаются; задать: gh secret set ИМЯ):
#   TELEGRAM_BOT_TOKEN — токен бота от @BotFather. До запуска добавьте бота в
#     группу команды и напишите там /start: id группы workflow найдёт сам.
#     Если групп несколько — задайте нужную секретом TELEGRAM_ADMIN_CHAT_ID.
#   RESEND_API_KEY — ключ Resend (бесплатно 3000 писем в месяц); домен
#     vethub.uz должен быть подтверждён в Resend.
#   RENDER_API_KEY — уже задан.
#
# Записывает в Render переменные бота, чата команды, оповещений о сбоях и
# почты, шлёт проверочное сообщение в чат и выкатывает API. Без секрета канал
# пропускается, поэтому запуск без новых секретов просто показывает, что на
# проде уже подключено. Повторный запуск безопасен.

name: Notifications setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
      SERVICE: srv-dbe9iflg1s2s73es8lh0
      API: https://api.render.com/v1
    steps:
      - name: Что уже подключено на проде
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::секрет RENDER_API_KEY не задан"; exit 1; }
          curl -fsS "$API/services/$SERVICE/env-vars?limit=100" -H "Authorization: Bearer $RENDER_API_KEY" > "$RUNNER_TEMP/env.json"
          # Только имена: значения остаются в Render.
          for k in TELEGRAM_BOT_TOKEN TELEGRAM_ADMIN_CHAT_ID ERROR_WEBHOOK_URL ERROR_WEBHOOK_CHAT_ID \
                   RESEND_API_KEY MAIL_FROM ADMIN_EMAIL VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY ESKIZ_EMAIL; do
            if jq -e --arg k "$k" 'any(.[]; .envVar.key == $k and (.envVar.value // "") != "")' "$RUNNER_TEMP/env.json" >/dev/null
            then echo "задано:    $k"; else echo "не задано: $k"; fi
          done
          cat > "$RUNNER_TEMP/put.sh" <<'EOF'
          put() {
            jq -n --arg v "$2" '{value: $v}' > "$RUNNER_TEMP/body.json"
            code=$(curl -s -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X PUT "$API/services/$SERVICE/env-vars/$1" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/body.json")
            rm -f "$RUNNER_TEMP/body.json"
            test "$code" = 200 || { echo "::error::Render ответил $code на $1"; jq -r '.message? // empty' "$RUNNER_TEMP/resp.json"; exit 1; }
            echo "записано: $1"
          }
          EOF

      - name: Telegram — чат команды и сбои сервера
        run: |
          set -euo pipefail
          if [ -z "$TG_TOKEN" ]; then echo "секрет TELEGRAM_BOT_TOKEN не задан — Telegram пропущен"; exit 0; fi
          source "$RUNNER_TEMP/put.sh"
          TG="https://api.telegram.org/bot$TG_TOKEN"
          echo "::add-mask::$TG"
          me=$(curl -fsS "$TG/getMe") || { echo "::error::Telegram не принял токен — проверьте TELEGRAM_BOT_TOKEN"; exit 1; }
          echo "бот: @$(echo "$me" | jq -r .result.username)"

          CHAT="$TG_CHAT"
          [ -n "$CHAT" ] || CHAT=$(jq -r '[.[] | select(.envVar.key == "TELEGRAM_ADMIN_CHAT_ID") | .envVar.value][0] // empty' "$RUNNER_TEMP/env.json")
          if [ -z "$CHAT" ]; then
            # Группа, куда добавили бота, видна в его обновлениях, пока бот не
            # запущен на проде (после запуска обновления забирает сервер).
            upd=$(curl -sS "$TG/getUpdates")
            [ "$(echo "$upd" | jq -r .ok)" = true ] || {
              echo "::error::обновления бота не читаются ($(echo "$upd" | jq -r .description)) — задайте секрет TELEGRAM_ADMIN_CHAT_ID"; exit 1; }
            echo "$upd" | jq -r '[.result[] | (.message.chat // .my_chat_member.chat // empty)
              | select(.type == "group" or .type == "supergroup")] | unique_by(.id) | .[] | "\(.id)\t\(.title)"' > "$RUNNER_TEMP/chats.tsv"
            n=$(wc -l < "$RUNNER_TEMP/chats.tsv" | tr -d ' ')
            if [ "$n" = 0 ]; then
              echo "::error::бот не видит ни одной группы — добавьте его в группу команды, напишите там /start и перезапустите"; exit 1
            fi
            if [ "$n" != 1 ]; then
              echo "::error::бот состоит в нескольких группах — задайте нужную секретом TELEGRAM_ADMIN_CHAT_ID:"; cat "$RUNNER_TEMP/chats.tsv"; exit 1
            fi
            CHAT=$(cut -f1 "$RUNNER_TEMP/chats.tsv")
            echo "группа команды: $(cut -f2 "$RUNNER_TEMP/chats.tsv")"
          fi

          # Сначала проверка, что бот может писать в чат, — потом запись в Render.
          jq -n --arg c "$CHAT" '{chat_id: $c, text: "✅ VetHub: сюда будут приходить новые заказы, заявки, продавцы на проверке, заявки на кредит и сбои сервера."}' > "$RUNNER_TEMP/msg.json"
          curl -fsS -X POST "$TG/sendMessage" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/msg.json" >/dev/null \
            || { echo "::error::бот не смог написать в чат — проверьте, что он состоит в группе"; exit 1; }
          put TELEGRAM_BOT_TOKEN "$TG_TOKEN"
          put TELEGRAM_ADMIN_CHAT_ID "$CHAT"
          put ERROR_WEBHOOK_URL "$TG/sendMessage"
          put ERROR_WEBHOOK_CHAT_ID "$CHAT"
          echo "CHANGED=1" >> "$GITHUB_ENV"

      - name: Почта — Resend
        run: |
          set -euo pipefail
          if [ -z "$RESEND_KEY" ]; then echo "секрет RESEND_API_KEY не задан — почта пропущена"; exit 0; fi
          source "$RUNNER_TEMP/put.sh"
          d=$(curl -sS https://api.resend.com/domains -H "Authorization: Bearer $RESEND_KEY")
          if echo "$d" | jq -e '.name == "restricted_api_key"' >/dev/null; then
            echo "::warning::ключ Resend только на отправку — подтверждение домена не проверено"
          else
            st=$(echo "$d" | jq -r '[.data[]? | select(.name == "vethub.uz") | .status][0] // "не добавлен"')
            echo "домен vethub.uz в Resend: $st"
            [ "$st" = verified ] || { echo "::error::домен vethub.uz в Resend не подтверждён ($st) — письма не уйдут"; exit 1; }
          fi
          put RESEND_API_KEY "$RESEND_KEY"
          put MAIL_FROM 'VetHub <no-reply@vethub.uz>'
          put ADMIN_EMAIL 'info@vethub.uz'
          echo "CHANGED=1" >> "$GITHUB_ENV"

      # Переменные Render применяются только новой выкаткой.
      - name: Выкатка
        if: env.CHANGED == '1'
        run: |
          set -euo pipefail
          curl -fsS -X POST "$API/services/$SERVICE/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            -d '{"clearCache":"do_not_clear"}' | jq '{id, status}'

      - name: Уборка
        if: always()
        run: rm -f "$RUNNER_TEMP"/env.json "$RUNNER_TEMP"/resp.json "$RUNNER_TEMP"/chats.tsv "$RUNNER_TEMP"/msg.json
