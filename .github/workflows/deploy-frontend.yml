# Выкатка фронтенда на Cloudflare Workers.
#
# Бэкенд выкатывает сам Render по своему автодеплою, а фронтенд после переезда
# с Vercel остался без автоматизации — приходилось выкладывать руками.
#
# Требуется секрет CLOUDFLARE_API_TOKEN (права Edit Cloudflare Workers).

name: Deploy frontend

on:
  push:
    branches: [main]
    # Только то, что реально попадает в сборку фронтенда.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Новый пуш отменяет незавершённую выкатку, иначе в прод может приехать
  # более старая сборка.
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 698b54a450016a5859e3febff97fdffe
      # Обе переменные нужны на этапе сборки: NEXT_PUBLIC_* вшивается в бандл,
      # а SITE_URL попадает в sitemap и канонические ссылки статических страниц.
      NEXT_PUBLIC_API_URL: https://api.vethub.uz/api
      SITE_URL: https://vethub.uz
    steps:
      # Без рабочего токена выкатка невозможна. Тогда прогон не падает после
      # каждого слияния, а пропускается с предупреждением: сайт выкатывается
      # вручную (wrangler владельца), отставание прода от main ловит Uptime.
      # Проверка — доступом к воркерам аккаунта, а не /tokens/verify: токен
      # другого аккаунта «активен», но выкатить сюда не может.
      - name: Токен Cloudflare рабочий
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts") || code=000
          if [ "$code" = 200 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::токен Cloudflare не даёт доступа к аккаунту (HTTP $code) — выкатка пропущена, сайт выкатывается вручную"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        if: steps.token.outputs.ok == 'true'
        working-directory: frontend

      - name: Сборка под Cloudflare
        if: steps.token.outputs.ok == 'true'
        working-directory: frontend
        run: npx opennextjs-cloudflare build

      - name: Выкатка
        if: steps.token.outputs.ok == 'true'
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Коммит сборки отдаётся на /__version — по нему uptime видит, что
          # прод отстал от main (так полтора месяца жил битый токен).
          BUILD_SHA: ${{ github.sha }}
        run: npx wrangler deploy --var "BUILD_SHA:$BUILD_SHA"

      - name: Проверка после выкатки
        if: steps.token.outputs.ok == 'true'
        run: |
          set -euo pipefail
          BASE=https://vethub.uz
          # Несколько попыток: Cloudflare раскатывает новую версию по краю
          # не мгновенно.
          for path in / /catalog /suppliers /blog /sitemap.xml; do
            ok=
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$BASE$path") || code=000
              if [ "$code" = 200 ]; then ok=1; echo "$path -> $code"; break; fi
              sleep 10
            done
            test -n "$ok" || { echo "::error::$path не ответил 200"; exit 1; }
          done
          # Отвечает именно новая сборка, а не прежняя версия на краю.
          for i in 1 2 3 4 5 6; do
            live=$(curl -s -m 30 "$BASE/__version" | jq -r '.sha // empty') || live=
            if [ "$live" = "$GITHUB_SHA" ]; then echo "/__version -> $live"; exit 0; fi
            sleep 10
          done
          echo "::error::/__version отдаёт «$live», ожидался $GITHUB_SHA"; exit 1
