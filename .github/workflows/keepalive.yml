# Пинг API от засыпания.
#
# Бесплатный сервис Render засыпает после 15 минут без запросов, и первый
# покупатель ждёт до минуты, пока он проснётся. Раньше будил воркер Cloudflare
# (ops/keepalive), но он живёт в старом аккаунте и после переезда API на
# betterfuture стучал в приостановленный сервер. Отсюда пинг не зависит ни от
# какого аккаунта: GitHub Actions для публичного репозитория бесплатен.
#
# Расписание GitHub опаздывает на 5–15 минут, поэтому раз в 10 минут: сервис
# после каждого запроса держится 15 минут, и окна сна остаются редкими.
#
# Лимит Render — 750 часов в месяц на пространство; круглосуточная работа —
# 744 часа в 31-дневном месяце. Поэтому в пространстве betterfuture должен
# оставаться только этот бесплатный сервис: второй исчерпает лимит до конца
# месяца, и Render приостановит оба — именно так прод лежал с 12 октября 2026.

name: Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Разбудить API
        # Сбой здесь не повод краснеть: о недоступности сообщает Uptime.
        run: curl -s -o /dev/null -m 90 -w '%{http_code}\n' https://vethub-api.onrender.com/api/health || true
