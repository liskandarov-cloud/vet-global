# Render Blueprint — бэкенд.
#
# С 24 октября 2026 прод живёт в пространстве betterfuture (laziz.iskandarov@
# betterfuture.uz): сервис vethub-api, srv-dbe9iflg1s2s73es8lh0, адрес
# https://vethub-api.onrender.com. Создан из публичного репозитория, не из этого
# Blueprint; файл описывает ту же конфигурацию и годится для пересоздания.
# Старый vetglobal-backend остался приостановленным в прежнем аккаунте.
# Render dashboard → New → Blueprint → connect this repo → Apply.
# Render injects PORT automatically (the app reads process.env.PORT); no manual
# port/root-directory config. The root Dockerfile builds the backend.
#
# База — Supabase, а не Postgres от Render (см. DB-MIGRATION-SUPABASE.md).
# Раньше здесь описывалась бесплатная база Render, и DATABASE_URL брался из неё:
# повторное применение Blueprint молча переключило бы прод на пустую базу,
# которую Render к тому же удаляет через 30 дней.

services:
  - type: web
    name: vethub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Session-пулер Supabase, порт 5432. Значение задаётся в дашборде и
      # Blueprint его не перезаписывает.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PLATFORM_COMMISSION_PERCENT
        value: "12"
      - key: VETPOINTS_EARN_PERCENT
        value: "1"
      - key: VETPOINTS_MAX_SPEND_PERCENT
        value: "10"
      - key: PAYMENTS_MODE
        value: mock
      - key: DIDOX_MODE
        value: mock
      - key: ADMIN_EMAIL
        value: admin@vetglobal.com
      # Пароль НЕ коммитим: в репозитории он означает открытый доступ к
      # админке прода. Render генерирует значение сам (один раз); сменить
      # пароль можно через POST /api/maintenance/user под другим админом.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Только собственный фронтенд: «*» вместе с credentials отражал любой
      # Origin, т.е. API мог дёргать любой сторонний сайт. Домены — через запятую.
      - key: CORS_ORIGINS
        value: "https://vetglobal-web.l-iskandarov.workers.dev"
      - key: FRONTEND_URL
        value: "https://vetglobal-web.l-iskandarov.workers.dev"
      # Swagger публикует карту всех эндпоинтов: 119 путей, 145 операций.
      # Данные за ней под авторизацией, но для атакующего это готовая разведка,
      # поэтому на боевом контуре выключена. Чтобы открыть на время интеграции,
      # достаточно поставить true в Environment — передеплой применит.
      - key: SWAGGER_ENABLED
        value: "false"
      # Кредитные лимиты выдаёт администратор, а не автоскоринг.
      #
      # В демо-режиме заявка одобряется мгновенно и на любую сумму до предела:
      # это годится для показа, но на боевом контуре означает, что покупатель
      # сам выдаёт себе лимит и забирает товар по отсрочке. Значение задано
      # явно, потому что умолчание в коде однажды снова окажется другим.
      - key: FINANCING_MODE
        value: manual

      # Демо-данные генерируются ТОЛЬКО при SEED_DEMO=true. На реальном клиенте — false.
      - key: SEED_DEMO
        value: "false"
      # Telegram-бот: значение задать в дашборде Render (Environment) — тогда бот
      # поднимется против прод-БД. ВАЖНО: только ОДИН процесс должен опрашивать бота.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      # Оповещения о серверных ошибках (5xx). Не задано — ошибки только в логах.
      # Значение задать в дашборде Render: URL вебхука (Telegram Bot API
      # sendMessage, Slack или Discord). Для Telegram укажите ещё
      # ERROR_WEBHOOK_CHAT_ID. Ключи не коммитим.
      - key: ERROR_WEBHOOK_URL
        sync: false
      - key: ERROR_WEBHOOK_CHAT_ID
        sync: false
